<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Surprise ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Hearts flying around -->
    <div id="hearts"></div>

    <!-- First screen -->
    <div class="screen" id="startScreen">

        <h1>A little something for you... 💜</h1>

        <p>Tap anywhere po!</p>

    </div>


    <!-- Main screen -->
    <div class="screen hidden" id="mainScreen">

        <div class="message">
            <h1>Happy Birthday</h1>

            <p>
                I made this just for you!
            </p>
        </div>

        <button class="heartButton" onclick="showMessage()">
            ❤️
        </button>

        <p class="tapText">Tap here ❤️</p>

    </div>


    <!-- Final message -->
    <div class="screen hidden" id="finalScreen">

        <div class="finalMessage">

            <h1>💌 For You</h1>

            <p>
                I WISH YOU A HAPPY BIRTHDAY
            </p>

            <p>
                It's my first time coding eh, hope you liked it! 
            </p>

        </div>

    </div>


    <!-- Your music -->
    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>


    <script src="script.js"></script>

</body>
</html>
